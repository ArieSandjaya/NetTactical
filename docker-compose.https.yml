# HTTPS straight from the API container (Kestrel), no reverse proxy:
#   1. put fullchain.pem and privkey.pem in ./certs (or set NATS_CERT_DIR); the key must be readable by the container user: chmod 644 certs/privkey.pem
#   2. .env: PUBLIC_URL=https://your.host.name   (HTTPS_PORT=443 is the default host port)
#   3. docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# Needs Docker Compose >= 2.24 (the !override tag). After renewing the certificate, restart the api container.
services:
  api:
    environment:
      ASPNETCORE_HTTPS_PORTS: "8443"
      Kestrel__Certificates__Default__Path: /certs/fullchain.pem
      Kestrel__Certificates__Default__KeyPath: /certs/privkey.pem
    volumes:
      - ${NATS_CERT_DIR:-./certs}:/certs:ro
    # HTTPS only: the plain HTTP port is no longer published on the host.
    ports: !override
      - "${HTTPS_PORT:-443}:8443"
